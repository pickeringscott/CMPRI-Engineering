name: Post-release seven-role Auth and Storage verification (one run)

on:
  push:
    branches: [sandbox/cmpri-seven-role-e2e]

permissions:
  contents: read

jobs:
  sandbox:
    # One bounded post-release run; reruns and subsequent pushes must skip.
    if: ${{ github.event.before == 'b2b087aee87b15037bdcd7b5a017faa713854e67' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify released application and sandbox isolation
        run: python tests/sandbox/verify-release.py
      - run: npm ci
      - name: Install pinned local Supabase CLI (verified archive)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cmpri-cli"
          cd "$RUNNER_TEMP/cmpri-cli"
          curl --fail --location --retry 3 --output supabase_linux_amd64.tar.gz https://github.com/supabase/cli/releases/download/v2.81.3/supabase_linux_amd64.tar.gz
          curl --fail --location --retry 3 --output checksums.txt https://github.com/supabase/cli/releases/download/v2.81.3/supabase_2.81.3_checksums.txt
          awk '$2 == "supabase_linux_amd64.tar.gz" { print }' checksums.txt > selected.sha256
          test -s selected.sha256
          sha256sum --check selected.sha256
          tar -xzf supabase_linux_amd64.tar.gz supabase
          echo "$RUNNER_TEMP/cmpri-cli" >> "$GITHUB_PATH"
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Harness predicate and redaction regressions
        run: python -m unittest discover -s tests/sandbox -p 'test_*.py' -v
      - name: Scoped equipment and troubleshooting checks
        run: node --experimental-strip-types --test tests/equipment-selection.test.mjs tests/troubleshooting-completed-steps.test.mjs tests/work-order-matching.test.mjs tests/chief-engineer-identity.test.mjs tests/work-order-dashboard.test.mjs tests/technician-coverage.test.mjs tests/sandbox/rls-expectations.test.mjs tests/sandbox/http-diagnostics.test.mjs
      - name: Real local Auth, Postgres, RLS, browser submissions and controlled push
        run: bash tests/sandbox/run.sh
      - name: Sanitized evidence (no key files, sessions, raw logs, caches or uploads)
        if: always()
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          print('## Local synthetic sandbox evidence')
          for name in ['setup-diagnostics.json', 'auth-preflight-results.json', 'summary.json', 'role-gaps.json', 'e2e-results.json', 'rls-results.json', 'lifecycle-results.json', 'notification-db-results.json', 'draft-results.json', 'browser-extra-results.json', 'storage-results.json', 'notification-state-results.json', 'http-diagnostics.json', 'browser-preflight-results.json', 'browser-diagnostics.json', 'server-diagnostics.json']:
              p = Path('.sandbox') / name
              print('\n### ' + name + '\n')
              print('```json\n' + p.read_text() + '\n```' if p.exists() else 'Not produced: setup or a previous phase did not finish.')
          PY
