*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020b1c}body{min-height:100svh;overflow-x:hidden}.scene{width:100%;height:100svh;min-height:360px;position:relative;isolation:isolate;overflow:hidden;background-color:#020b1c;background-image:linear-gradient(#18395742 1px,transparent 1px),linear-gradient(90deg,#18395742 1px,transparent 1px),radial-gradient(ellipse at 50% 40%,#081d36,#01091a);background-size:36px 36px,36px 36px,100% 100%}.art{position:absolute;left:0;bottom:0;z-index:2;display:block;width:100%;height:auto;max-height:72svh;overflow:visible}.ground{position:absolute;z-index:0;pointer-events:none;inset:90% 0 0;background:linear-gradient(transparent,#030916 65%);border-bottom:1px solid #50402a}.leaves{position:absolute;z-index:1;inset:0;overflow:hidden;pointer-events:none}.leaf{position:absolute;top:-10%;left:var(--x);width:var(--size);height:var(--size);color:var(--color);opacity:0;animation:fall var(--duration) linear var(--delay) infinite}.leaf svg{width:100%;height:100%;overflow:visible;animation:tumble var(--duration) ease-in-out var(--delay) infinite}.control{z-index:3}.rig{transform-origin:775px 1070px;animation:bob 3.8s ease-in-out infinite}.tail-a{transform-origin:800px 765px;animation:tailA 4.3s ease-in-out infinite}.tail-b{transform-origin:800px 765px;animation:tailB 4.8s ease-in-out infinite}.tail-c{transform-origin:800px 765px;animation:tailC 4s ease-in-out infinite}.wing-left{transform-origin:758px 653px;animation:flapLeft 3.6s ease-in-out infinite}.wing-right{transform-origin:1030px 710px;animation:flapRight 3.6s ease-in-out infinite}.eyelids{animation:blink 5.9s infinite;opacity:0}.shadow{transform-origin:650px 686px;animation:shadow 3.8s ease-in-out infinite}.control{position:absolute;right:18px;bottom:14px;border:1px solid #49647f;border-radius:50%;width:44px;height:44px;color:#8fa7c0;background:#061326b8;font:18px system-ui;cursor:pointer}.control:focus-visible{outline:3px solid #e6ad45;outline-offset:3px}.paused *{a .pumpkin-gourd-layer{display:none}.desktop-spaced-gourds{display:block}</style></head><body><main class="scene" id="scene" aria-label="CMPRI Engineering Thanksgiving greeting"><div class="ground" aria-hidden="true"></div><div class="leaves" id="leaves" aria-hidden="true"></div><svg class="art" id="art" viewBox="0 0 1600 650" preserveAspectRatio="xMinYMax meet" role="img" aria-labelledby="title desc"><title id="title">Happy Thanksgiving — CMPRI Engineering</title><desc id="desc">A cheerful pilgrim turkey gently bobs, blinks, flaps both wings independently, and sways its tail feathers beside a stationary gold Happy Thanksgiving greeting on a full-width navy blueprint grid. Autumn leaves drift from above the top of the scene and settle along the bottom.</desc><defs>

<text class="watermark" x="800" y="642" fill="#577fa6" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" letter-spacing="8">CMPRI ENGINEERING</text></svg><button class="control" type="button" id="toggle" aria-label="Pause animation" aria-pressed="false">Ⅱ</button></main><script>const scene=document.getElementById('scene'),toggle=document.getElementById('toggle'),field=document.getElementById('leaves');
const reduced=matchMedia('(prefers-reduced-motion:reduce)');let paused=false,last=0,elapsed=0,spawnAt=0,landed=0;const active=[],settled=[],capacity=480,maxActive=48;const speed=1;
const colors=['#e9a830','#d76320','#b43d21','#ecc15a','#ce6228'];const rnd=(a,b)=>a+Math.random()*(b-a);
function metrics(){const r=scene.getBoundingClientRect(),g=document.querySelector('.art').getBoundingClientRect();return {w:r.width,h:r.height,cap:g.height/650*80}}
const leafShapes=[["White oak","M30 3C41 2 43 12 35 17C51 9 57 22 42 28C61 23 62 38 44 40C59 47 49 57 36 49L32 62L28 62L25 51C10 62 1 49 17 41C0 42 0 27 18 29C2 20 13 10 25 18C16 8 23 2 30 3Z"],["Sugar maple","M30 2L36 20L44 13L43 29L58 25L49 39L54 45L35 50L31 64L28 64L28 51L8 47L14 39L2 25L19 29L17 13L25 20Z"],["American elm","M29 3L35 12L40 13L40 18L46 20L44 25L51 29L47 34L52 39L46 43L48 48L41 52L38 57L31 60L29 66L27 65L28 58L21 56L15 53L13 49L9 46L12 41L7 37L11 32L8 28L14 25L12 20L19 18L20 13L25 11Z"],["Green ash","M30 2Q45 12 30 25Q15 12 30 2Z M27 27Q6 8 7 27Q12 38 27 30Z M33 27Q54 8 53 27Q48 38 33 30Z M27 41Q4 23 6 43Q14 53 27 44Z M33 41Q56 23 54 43Q46 53 33 44Z M28 54Q9 40 12 57Q21 64 28 57Z M32 54Q51 40 48 57Q39 64 32 57Z"],["American sycamore","M30 2L39 24L47 17L45 31L59 32L48 43L52 51L36 53L31 66L28 65L28 54L10 54L14 44L1 33L16 31L13 17L23 24Z"],["Eastern cottonwood","M30 3L35 13L40 19L41 24L47 28L47 33L53 39L51 44L57 50L52 54L44 55L39 59L31 58L30 66L28 66L27 58L20 60L15 56L7 55L4 50L9 44L7 40L14 34L14 29L20 25L21 19L26 13Z"]];
function add(){const m=metrics(),size=rnd(Math.max(24,Math.min(42,m.w*.027)),Math.max(30,Math.min(56,m.w*.036)));const e=document.createElement('span');e.className='leaf';e.style.width=size+'px';e.style.height=size+'px';e.style.color=colors[Math.floor(rnd(0,5))];const shape=leafShapes[Math.floor(rnd(0,leafShapes.length))];e.dataset.species=shape[0];e.innerHTML='<svg viewBox="0 0 60 70"><path d="'+shape[1]+'" fill="currentColor" stroke="#743c20" stroke-width="1.1"/><path d="M30 10L30 66M30 32L17 25M30 42L44 33M30 52L18 45" fill="none" stroke="#69371b" stroke-width="1.2"/></svg>';field.appendChild(e);active.push({e,size,born:elapsed,duration:rnd(9500,16500),x:rnd(0,1),depth:rnd(0,1),phase:rnd(0,7),sway:rnd(20,80),turn:rnd(-540,540),angle:rnd(0,360)});}
function position(v,p){const m=metrics(),flat=.28,radius=v.size*flat*.71,cap=Math.max(radius*2,m.cap),rise=radius+v.depth*Math.max(0,cap-radius*2),x=v.x*m.w,y=m.h-rise;const dx=Math.sin(p*7+v.phase)*v.sway*(1-p);v.e.style.transform='translate('+(x+dx-v.size/2)+'px,'+(-v.size+(y+v.size)*p-v.size/2)+'px) scaleY('+(1-p*(1-flat))+') rotate('+(v.angle+(1-p)*v.turn)+'deg)';}
function frame(t){const dt=last?Math.min(t-last,100):0;last=t;if(!paused&&!reduced.matches&&!document.hidden){elapsed+=dt*speed;if(elapsed>=spawnAt&&active.length<maxActive){add();spawnAt=elapsed+rnd(380,620);}for(let i=active.length-1;i>=0;i--){const v=active[i],p=Math.min(1,(elapsed-v.born)/v.duration);position(v,p);if(p===1){if(!v.landTime){v.landTime=elapsed;landed++;if(settled.length<capacity){v.depth*=Math.sqrt((settled.length+1)/capacity);position(v,1);v.e.classList.add('settled');settled.push(v);active.splice(i,1);continue;}}const fade=(elapsed-v.landTime)/1300;v.e.style.opacity=String(Math.max(0,.92*(1-fade)));if(fade>=1){v.e.remove();active.splice(i,1);}}}}scene.dataset.settled=settled.length;scene.dataset.active=active.length;scene.dataset.capacity=capacity;scene.dataset.landed=landed;requestAnimationFrame(frame);}
toggle.addEventListener('click',()=>{paused=!paused;scene.classList.toggle('paused',paused);toggle.setAttribute('aria-pressed',String(paused));toggle.setAttribute('aria-label',paused?'Resume animation':'Pause animation');toggle.textContent=paused?'▶':'Ⅱ';});
addEventListener('resize',()=>settled.forEach(v=>position(v,1)));
if(reduced.matches){for(let i=0;i<80;i++){add();const v=active.pop();v.e.classList.add('settled');settled.push(v);position(v,1);}scene.dataset.settled=settled.length;}requestAnimationFrame(frame);
