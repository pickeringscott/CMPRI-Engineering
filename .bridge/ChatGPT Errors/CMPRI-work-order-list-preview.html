f (restoreFocus) activeHelp.focus();\n  }\n  activeHelp = null;\n}\nmodal.querySelectorAll('.work-order-tier-help').forEach(button => {\n  button.addEventListener('click', event => {\n    event.stopPropagation();\n    const same = activeHelp === button && !key.hidden;\n    closeKey();\n    if (same) return;\n    activeHelp = button;\n    button.setAttribute('aria-expanded', 'true');\n    key.hidden = false;\n    positionKey();\n  });\n});\ndocument.addEventListener('pointerdown', event => {\n  if (!event.target.closest('.work-order-tier-key,.work-order-tier-popover')) closeKey();\n});\ndocument.addEventListener('keydown', event => {\n  if (event.key === 'Escape' && !key.hidden) {\n    event.preventDefault();\n    closeKey(true);\n  }\n});\nlist.parentElement.addEventListener('scroll', () => closeKey(), {passive: true});\nwindow.addEventListener('resize', () => closeKey());\n\nfunction tier(row) {\n  const mark = row.querySelector('.work-order-room-line .tier-m');\n  return mark ? ['ambassador','titanium','platinum','gold','silver','base'].findIndex(name => mark.classList.contains('tier-' + name)) : 6;\n}\nfunction update() {\n  closeKey();\n  const q = search.value.toLowerCase();\n  const visible = rows.filter(row => {\n    const s = row.dataset.previewStatus.toLowerCase();\n    return (!q || row.textContent.toLowerCase().includes(q)) &&\n      (filter === 'all' || filter === 'pending' && s === 'pending verification' ||\n       filter === 'open' && s === 'open' || filter === 'progress' && s === 'in progress' ||\n       filter === 'priority' && /High Priority|Urgent Priority/.test(row.textContent) ||\n       filter === 'completed' && s === 'completed' || filter === 'closed' && s === 'closed');\n  });\n  if (sort.value === 'tier-high') visible.sort((a,b) => tier(a) - tier(b));\n  if (sort.value === 'tier-low') visible.sort((a,b) => tier(b) - tier(a));\n  if (['created-newest','due-latest'].includes(sort.value)) visible.reverse();\n  list.replaceChildren(...visible);\n  status.textContent = visible.length + ' of ' + rows.length;\n  sort.dataset.sortDefault = String(sort.value === 'default');\n}\nsearch.oninput = update;\nsort.onchange = update;\nfilters.forEach(button => button.onclick = () => {\n  filter = button.dataset.previewKpi;\n  search.value = '';\n  filters.forEach(item => item.setAttribute('aria-pressed', String(item === button)));\n  update();\n});\nmodal.querySelector('[data-cmpri-window-close]').onclick = () => {\n  closeKey();\n  modal.hidden = true;\n  document.body.insertAdjacentHTML('beforeend', '<p style=\"padding:24px;color:#cbd5e1\">Preview closed. Select Reset preview to reopen it.<\/p>');\n};\n\n// Allocate actual label/count widths, then share the remaining room. The\n// layout switches directly from eight columns to two balanced rows of four.\nconst measure = document.createElement('canvas').getContext('2d');\nfunction requiredWidths(compact, fontSize) {\n  grid.dataset.compact = String(compact);\n  filters.forEach(button => [...button.children].forEach(span => {\n    span.style.setProperty('font-size', fontSize + 'px', 'important');\n  }));\n  const ordered = filters.map((button,index) => ({button,index}))\n    .sort((a,b) => Number(getComputedStyle(a.button).order) - Number(getComputedStyle(b.button).order) || a.index - b.index);\n  return ordered.map(({button}) => {\n    const label = button.querySelector(compact ? '.filter-label-short' : '.filter-label-full');\n    const count = button.lastElementChild;\n    function width(element) {\n      const style = getComputedStyle(element);\n      measure.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;\n      const value = element.textContent.toUpperCase();\n      return measure.measureText(value).width + Math.max(0,value.length - 1) * (parseFloat(style.letterSpacing) || 0);\n    }\n    return Math.ceil(width(label) + width(count) + 24);\n  });\n}\nfunction layoutFilters() {\n  const available = grid.clientWidth;\n  if (!available) return;\n  const gap = 4;\n  let widths = requiredWidths(false, 11);\n  let columns = 8;\n  if (widths.reduce((a,b) => a+b, 0) + gap * 7 > available) {\n    columns = 4;\n    const group = values => Array.from({length:4}, (_,i) => Math.max(values[i],values[i+4]));\n    let tracks = group(widths);\n    if (tracks.reduce((a,b) => a+b,0) + gap * 3 > available) {\n      for (let font = 11; font >= 8; font -= .5) {\n        widths = requiredWidths(true, font);\n        tracks = group(widths);\n        if (tracks.reduce((a,b) => a+b,0) + gap * 3 <= available) break;\n      }\n    }\n    widths = tracks;\n  }\n  grid.dataset.columns = String(columns);\n  grid.style.setProperty('grid-template-columns', widths.map(width => `minmax(${width}px,1fr)`).join(' '), 'important');\n}\nlet pendingLayout = 0;\nconst observer = new ResizeObserver(() => {\n  cancelAnimationFrame(pendingLayout);\n  pendingLayout = requestAnimationFrame(layoutFilters);\n});\nobserver.observe(grid);\nlayoutFilters();\n\n<\/script><\/body><\/html>";const frame=document.querySelector('iframe');frame.srcdoc=source;
