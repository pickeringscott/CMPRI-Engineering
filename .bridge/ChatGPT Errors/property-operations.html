<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property Operations</title><style>
:root{font:15px system-ui,sans-serif;color:#182f39;background:#f3f6f7}*{box-sizing:border-box}body{margin:0}header{background:#123b42;color:white;padding:24px 5%;display:flex;align-items:center;justify-content:space-between;gap:20px}header small{color:#b1d5d4}h1{font-size:27px;margin:7px 0}main{max-width:1250px;margin:auto;padding:32px 24px}select,input,button,textarea{font:inherit;padding:11px 13px;border:1px solid #ccd8da;border-radius:8px;background:white;color:#182f39}button{cursor:pointer}button:hover{background:#e7f1ef}.primary{background:#11766d;color:white;border-color:#11766d}.primary:hover{background:#0c5b54}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.toolbar input{flex:1;min-width:180px}h2{font-size:30px;margin:0 0 8px}.muted{color:#637881}.cards{display:flex;gap:16px;margin:25px 0}.card{flex:1;background:white;border:1px solid #dce5e6;border-radius:12px;padding:20px}.card strong{display:block;font-size:30px;margin-top:8px}.panel{background:white;border:1px solid #dce5e6;border-radius:12px;overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:16px;border-bottom:1px solid #e7eded}th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;background:#f8fafb;color:#5e727b}td:first-child{font-weight:600}.badge{display:inline-block;border-radius:20px;background:#e6f5ef;color:#18644d;padding:5px 10px;font-size:12px}footer{margin-top:24px;font-size:12px;color:#637881}dialog{border:0;border-radius:14px;width:min(480px,94vw);padding:28px;box-shadow:0 20px 90px #1235}dialog::backdrop{background:#102d3b66}form{display:grid;gap:15px}label{display:grid;gap:7px;font-size:13px;font-weight:600}.actions{display:flex;gap:8px;justify-content:flex-end}#notice{min-height:20px;color:#18644d;margin:10px 0}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}.cards{gap:8px}.card{padding:12px}.card strong{font-size:24px}main{padding:24px 14px}h2{font-size:25px}}@media print{header select,.toolbar,button,footer{display:none}body{background:white}}
</style></head><body><header><div><small>PROPERTY OPERATIONS / WORKSPACE</small><h1>Operations desk</h1></div><label>Workspace<select id="view"><option>Manage Locations</option><option>Daily Room Ops</option><option>Work Order List</option></select></label></header><main><h2 id="title"></h2><div class="muted" id="subtitle"></div><div class="cards" id="cards"></div><div class="toolbar"><input id="search" aria-label="Search records" placeholder="Search records…"><select id="filter" aria-label="Filter status"></select><button id="export">Export CSV</button><button class="primary" id="add"></button></div><div class="panel"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><div id="notice" role="status"></div><footer>Standalone workspace · Sample data included · Changes save in this browser when storage is available. Export CSV for a portable copy.</footer></main><dialog id="dialog"><form id="form"><h2 id="formTitle" style="font-size:23px"></h2><div id="fields" style="display:grid;gap:15px"></div><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary">Save record</button></div></form></dialog>
<script>
'use strict';
const configs=[{title:'Manage Locations',subtitle:'Keep your property directory organized and ready for daily operations.',singular:'location',columns:['Location','Building','Floor','Type','Status'],keys:['name','building','floor','type','status'],statuses:['Active','Inactive'],data:[{name:'Room 101',building:'North Wing',floor:'1',type:'Guest room',status:'Active'},{name:'Room 102',building:'North Wing',floor:'1',type:'Guest room',status:'Active'},{name:'Conference A',building:'Main Building',floor:'2',type:'Meeting room',status:'Active'}]},{title:'Daily Room Ops',subtitle:'Track room readiness, assign your team, and keep the day moving.',singular:'room task',columns:['Room','Task','Assigned to','Date','Status'],keys:['name','task','assignee','date','status'],statuses:['Pending','In progress','Ready'],data:[{name:'Room 101',task:'Departure clean',assignee:'Alex Morgan',date:new Date().toLocaleDateString('en-CA'),status:'Pending'},{name:'Room 102',task:'Inspection',assignee:'Jamie Lee',date:new Date().toLocaleDateString('en-CA'),status:'In progress'}]},{title:'Work Order List',subtitle:'Coordinate maintenance from the first report through completion.',singular:'work order',columns:['Work order','Location','Assigned to','Priority','Status'],keys:['name','location','assignee','priority','status'],statuses:['Open','In progress','Completed'],data:[{name:'WO-1001 · AC inspection',location:'Room 101',assignee:'Sam Rivera',priority:'High',status:'Open'},{name:'WO-1002 · Replace lamp',location:'Room 102',assignee:'Taylor Kim',priority:'Normal',status:'In progress'}]}];
const $=id=>document.getElementById(id);let active=0,editing=-1,storage=true;let db=configs.map(c=>c.data);try{const saved=JSON.parse(localStorage.getItem('property-ops-v1'));if(Array.isArray(saved)&&saved.length===3&&saved.every((a,i)=>Array.isArray(a)&&a.every(r=>configs[i].keys.every(k=>typeof r[k]==='string'))))db=saved}catch(e){storage=false}
function save(){try{localStorage.setItem('property-ops-v1',JSON.stringify(db))}catch(e){storage=false}$('notice').textContent=storage?'Saved in this browser.':'Changes are in memory only. Export CSV before closing.'}
function node(tag,text){const el=document.createElement(tag);el.textContent=text;return el}
function visible(){const q=$('search').value.toLowerCase(),f=$('filter').value;return db[active].map((r,i)=>({r,i})).filter(({r})=>Object.values(r).join(' ').toLowerCase().includes(q)&&(!f||r.status===f))}
function render(){const c=configs[active];$('title').textContent=c.title;$('subtitle').textContent=c.subtitle;$('add').textContent='+ Add '+c.singular;$('cards').replaceChildren();const done=c.statuses.at(-1);for(const [label,count]of [['Total records',db[active].length],[c.statuses[0],db[active].filter(r=>r.status===c.statuses[0]).length],[done,db[active].filter(r=>r.status===done).length]]){const card=node('div','');card.className='card';card.append(node('span',label),node('strong',count));$('cards').append(card)}const tr=document.createElement('tr');[...c.columns,'Actions'].forEach(t=>tr.append(node('th',t)));$('head').replaceChildren(tr);$('rows').replaceChildren();for(const {r,i}of visible()){const row=document.createElement('tr');c.keys.forEach(k=>{const td=document.createElement('td');if(k==='status'){const s=node('span',r[k]);s.className='badge';td.append(s)}else td.textContent=r[k];row.append(td)});const td=document.createElement('td');const edit=node('button','Edit');edit.onclick=()=>openForm(i);const del=node('button','Delete');del.style.marginLeft='6px';del.onclick=()=>{if(confirm('Delete '+r.name+'?')){db[active].splice(i,1);save();render()}};td.append(edit,del);row.append(td);$('rows').append(row)}if(!visible().length){const td=node('td','No records found. Add a record or adjust your search.');td.colSpan=6;const row=document.createElement('tr');row.append(td);$('rows').append(row)}}
function switchView(){active=$('view').selectedIndex;$('search').value='';$('filter').replaceChildren(new Option('All statuses',''),...configs[active].statuses.map(s=>new Option(s,s)));$('notice').textContent='';render()}
function openForm(i=-1){editing=i;const c=configs[active];$('formTitle').textContent=(i<0?'Add ':'Edit ')+c.singular;$('fields').replaceChildren();c.keys.forEach((k,j)=>{const l=node('label',c.columns[j]);let input;if(k==='status'||k==='priority'){input=document.createElement('select');(k==='status'?c.statuses:['Low','Normal','High','Urgent']).forEach(v=>input.add(new Option(v,v)))}else{input=document.createElement('input');input.type=k==='date'?'date':'text';input.maxLength=200}input.name=k;input.required=true;if(i>=0)input.value=db[active][i][k];l.append(input);$('fields').append(l)});$('dialog').showModal()}
$('form').onsubmit=e=>{e.preventDefault();const r=Object.fromEntries(new FormData(e.target));for(const k in r)r[k]=r[k].trim();if(Object.values(r).some(v=>!v)){alert('Please complete every field.');return}if(editing<0)db[active].push(r);else db[active][editing]=r;save();$('dialog').close();render()};$('cancel').onclick=()=>$('dialog').close();$('add').onclick=()=>openForm();$('view').onchange=switchView;$('search').oninput=render;$('filter').onchange=render;$('export').onclick=()=>{const c=configs[active];const quote=v=>'"'+String(v).replace(/"/g,'""').replace(/^[=+@-]/,"'$&")+'"';const csv='\ufeff'+[c.columns,...visible().map(({r})=>c.keys.map(k=>r[k]))].map(row=>row.map(quote).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=c.title.toLowerCase().replaceAll(' ','-')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};switchView();
</script></body></html>
