<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operations Hub</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:#173e36;font:14px system-ui,sans-serif}header{background:#153f37;color:white;padding:24px 5%;display:flex;justify-content:space-between;align-items:center;gap:20px}header b{font-size:22px;letter-spacing:-.7px}header small{display:block;color:#aacebb;margin-top:6px;letter-spacing:2px;font-size:10px}header label{font-size:11px;display:grid;gap:6px}main{max-width:1250px;margin:auto;padding:40px 24px}h1{font-size:32px;letter-spacing:-1px;margin:0 0 8px}p{color:#6a8075;line-height:1.6}.heading,.tools,.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}.heading{margin-bottom:26px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.stat,.panel{background:white;border:1px solid #dfe8e1;border-radius:12px}.stat{padding:22px;color:#688074}.stat strong{display:block;font-size:30px;color:#173e36;margin-top:12px}.panel{overflow:hidden}.tools{padding:18px;border-bottom:1px solid #e8eee9}button,input,select,textarea{font:inherit;border:1px solid #cfddd3;border-radius:7px;padding:10px 13px;color:#214f3d;background:white}button,select{cursor:pointer}button:hover{background:#e9f3eb}button.primary{background:#216d50;color:white;border-color:#216d50}input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid #63a988;outline-offset:2px}.tools input{flex:1;max-width:380px;min-width:100px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#7b8f80;background:#f9fbf9}th,td{padding:17px 20px;border-bottom:1px solid #eef2ee}td{font-size:13px}.badge{display:inline-block;background:#e5f3e9;color:#34744b;border-radius:5px;padding:5px 9px;font-size:11px;font-weight:650}.badge.warn{background:#fff0d2;color:#966113}.badge.red{background:#fbe8e5;color:#a54b40}.badge.gray{background:#edf1f3;color:#63717a}.edit{padding:6px 12px;background:#f0f6f1;font-size:12px}.note{padding:12px 16px;background:#e7f0e9;border-radius:7px;color:#5f7b67;font-size:12px;line-height:1.6}.bottom{margin-top:20px;color:#7e9183;font-size:11px}dialog{width:450px;max-width:calc(100% - 32px);border:1px solid #d9e5db;border-radius:14px;padding:25px;box-shadow:0 20px 80px #143f3740}dialog::backdrop{background:#153f3766}h2{margin:0 0 20px}form label{display:grid;gap:6px;margin:13px 0;font-size:12px;color:#627b69}form input,form select,textarea{width:100%}.buttons{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}#msg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#153f37;color:white;padding:13px 22px;border-radius:8px}#msg:empty{display:none}@media(max-width:650px){header,.heading{align-items:flex-start;flex-direction:column}header label,header select{width:100%}main{padding:25px 16px}.stat{padding:14px}.stats{gap:8px}.tools{flex-wrap:wrap}.bottom{align-items:flex-start;flex-direction:column}h1{font-size:28px}}
</style><header><div><b>▦ &nbsp; Operations Hub</b><small>PROPERTY & ENGINEERING</small></div><label>WORKSPACE<select id="view"><option value="locations">Manage Locations</option><option value="rooms">Daily Room Ops</option><option value="orders">Work Order List</option></select></label></header><main><div class="heading"><div><h1 id="title"></h1><p id="sub"></p></div><div><button id="export">Export CSV</button> <button class="primary" id="add"></button></div></div><div class="note">Offline workspace · Sample data included. Edits are saved in this browser when storage is available. No connection to live property systems. Export CSV to keep a separate copy.</div><div id="stats" class="stats"></div><div class="panel"><div class="tools"><input id="search" type="search" placeholder="Search records…" aria-label="Search records"><select id="filter" aria-label="Filter status"></select><input type="date" id="date" aria-label="Operations date" hidden><span id="count"></span></div><div class="scroll"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div></div><div class="bottom"><span id="storage"></span><span>One file · Three workspaces · Works offline</span></div></main><dialog id="dialog"><form id="form"><h2 id="formTitle"></h2><div id="fields"></div><div class="buttons"><button type="button" id="cancel">Cancel</button><button type="submit" class="primary">Save changes</button></div></form></dialog><div id="msg" role="status"></div><script>
'use strict';const $=id=>document.getElementById(id);const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const now=new Date(),today=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');const key='offline-operations-hub-v1';
const cfg={locations:{title:'Manage Locations',sub:'Organize rooms, shared spaces, and service areas.',add:'+ Add location',fields:[['name','Location','text'],['area','Area / floor','text'],['type','Type',['Guest room','Public area','Amenity','Service area']],['status','Status',['Active','Inactive']]]},rooms:{title:'Daily Room Ops',sub:'Track room readiness and daily team assignments.',add:'+ Add room record',fields:[['location','Room','location'],['occupancy','Occupancy',['Vacant','Occupied']],['status','Room status',['Dirty','Clean','Inspected','Out of order']],['assignee','Assigned to','text'],['date','Date','date'],['notes','Notes','textarea']]},orders:{title:'Work Order List',sub:'Follow maintenance requests from first report to completion.',add:'+ New work order',fields:[['title','Request','text'],['location','Location','location'],['priority','Priority',['Low','Normal','High','Urgent']],['status','Status',['Open','In progress','Completed']],['assignee','Assigned to','text'],['date','Created','date']]}};
let data={locations:[{id:1,name:'101',area:'Floor 1 · East Wing',type:'Guest room',status:'Active'},{id:2,name:'102',area:'Floor 1 · East Wing',type:'Guest room',status:'Active'},{id:3,name:'201',area:'Floor 2 · West Wing',type:'Guest room',status:'Active'},{id:4,name:'Main Lobby',area:'Ground floor',type:'Public area',status:'Active'},{id:5,name:'Fitness Center',area:'Ground floor',type:'Amenity',status:'Inactive'}],rooms:[{id:1,location:'101',occupancy:'Occupied',status:'Inspected',assignee:'Jordan Lee',date:today,notes:'Ready for guest service'},{id:2,location:'102',occupancy:'Vacant',status:'Dirty',assignee:'Sam Rivera',date:today,notes:'Departure clean'},{id:3,location:'201',occupancy:'Vacant',status:'Out of order',assignee:'Alex Chen',date:today,notes:'HVAC inspection pending'}],orders:[{id:1001,title:'Air conditioning not cooling',location:'201',priority:'High',status:'In progress',assignee:'Alex Chen',date:today},{id:1002,title:'Replace lobby light fixture',location:'Main Lobby',priority:'Normal',status:'Open',assignee:'Jordan Lee',date:today},{id:1003,title:'Inspect treadmill belt',location:'Fitness Center',priority:'Low',status:'Completed',assignee:'Sam Rivera',date:today}]};let saved=true;try{const s=JSON.parse(localStorage.getItem(key));if(s&&['locations','rooms','orders'].every(k=>Array.isArray(s[k])))data=s}catch(err){saved=false}let view='locations',editing=null,visible=[];
function badge(s){return '<span class="badge '+(['Dirty','In progress','Normal'].includes(s)?'warn':['Urgent','High','Out of order'].includes(s)?'red':['Inactive','Open','Vacant','Low'].includes(s)?'gray':'')+'">'+e(s)+'</span>'}function stat(label,n){return '<div class="stat">'+label+'<strong>'+n+'</strong></div>'}
function render(){const c=cfg[view],all=data[view],base=all.filter(r=>view!=='rooms'||r.date===$('date').value);$('title').textContent=c.title;$('sub').textContent=c.sub;$('add').textContent=c.add;$('date').hidden=view!=='rooms';visible=base.filter(r=>(!$('filter').value||r.status===$('filter').value)&&Object.values(r).join(' ').toLowerCase().includes($('search').value.toLowerCase()));$('stats').innerHTML=view==='locations'?stat('Total locations',all.length)+stat('Active',all.filter(r=>r.status==='Active').length)+stat('Guest rooms',all.filter(r=>r.type==='Guest room').length):view==='rooms'?stat('Rooms tracked',base.length)+stat('Ready',base.filter(r=>['Clean','Inspected'].includes(r.status)).length)+stat('Needs attention',base.filter(r=>['Dirty','Out of order'].includes(r.status)).length):stat('Active requests',all.filter(r=>r.status!=='Completed').length)+stat('High priority',all.filter(r=>r.status!=='Completed'&&['High','Urgent'].includes(r.priority)).length)+stat('Completed',all.filter(r=>r.status==='Completed').length);$('head').innerHTML='<tr><th>ID</th>'+c.fields.map(f=>'<th scope="col">'+f[1]+'</th>').join('')+'<th scope="col">Action</th></tr>';$('rows').innerHTML=visible.length?visible.map(r=>'<tr><td>'+ (view==='orders'?'WO-':'')+r.id+'</td>'+c.fields.map(([k])=>'<td>'+(['status','priority','occupancy'].includes(k)?badge(r[k]):e(r[k]))+'</td>').join('')+'<td><button class="edit" data-id="'+r.id+'" aria-label="Edit '+e(r.name||r.title||r.location)+'">Edit</button></td></tr>').join(''):'<tr><td colspan="'+(c.fields.length+2)+'" style="text-align:center;padding:45px">No matching records. Adjust your filters or add a record.</td></tr>';$('count').textContent=visible.length+' records';$('storage').textContent=saved?'Saved locally in this browser':'Storage unavailable · Export to keep this session’s changes'}
function switchView(){view=$('view').value;$('filter').innerHTML='<option value="">All statuses</option>'+cfg[view].fields.find(f=>f[0]==='status')[2].map(s=>'<option>'+s+'</option>').join('');$('search').value='';render()}
function edit(id){editing=id??null;const row=id==null?{}:data[view].find(r=>r.id===id);$('formTitle').textContent=(id==null?'Add ':'Edit ')+(view==='locations'?'location':view==='rooms'?'room record':'work order');$('fields').innerHTML=cfg[view].fields.map(([name,label,type])=>{const value=row[name]??(type==='date'?$('date').value:'');let control;if(Array.isArray(type)||type==='location'){const options=type==='location'?[...new Set(data.locations.map(r=>r.name).concat(row.location?[row.location]:[]))]:type;control='<select name="'+name+'" required>'+options.map(v=>'<option '+(v===value?'selected':'')+'>'+e(v)+'</option>').join('')+'</select>'}else if(type==='textarea')control='<textarea name="'+name+'" maxlength="500">'+e(value)+'</textarea>';else control='<input name="'+name+'" type="'+type+'" value="'+e(value)+'" maxlength="160" required>';return '<label>'+label+control+'</label>'}).join('');$('dialog').showModal()}
let timer;function toast(t){$('msg').textContent=t;clearTimeout(timer);timer=setTimeout(()=>$('msg').textContent='',3000)}
$('form').onsubmit=ev=>{ev.preventDefault();const values=Object.fromEntries(new FormData($('form')));Object.keys(values).forEach(k=>values[k]=values[k].trim());if(cfg[view].fields.some(([k,,t])=>t!=='textarea'&&!values[k]))return toast('Fill in each required field.');if(view==='locations'&&data.locations.some(r=>r.id!==editing&&r.name.toLowerCase()===values.name.toLowerCase()))return toast('Location already exists.');if(view==='rooms'&&data.rooms.some(r=>r.id!==editing&&r.location===values.location&&r.date===values.date))return toast('This room already has a record for that date.');if(editing==null)data[view].push({...values,id:Math.max(0,...data[view].map(r=>r.id))+1});else{const row=data[view].find(r=>r.id===editing);if(view==='locations'&&row.name!==values.name)for(const k of ['rooms','orders'])data[k].forEach(r=>{if(r.location===row.name)r.location=values.name});Object.assign(row,values)}try{localStorage.setItem(key,JSON.stringify(data));saved=true}catch(err){saved=false}$('dialog').close();render();toast('Record saved'+(saved?'':' for this session'))};
$('export').onclick=()=>{const keys=['id',...cfg[view].fields.map(f=>f[0])],cell=v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"',csv='\ufeff'+[keys,...visible.map(r=>keys.map(k=>r[k]))].map(row=>row.map(cell).join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=view+'-'+$('date').value+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Exported '+visible.length+' records')};$('view').onchange=switchView;$('filter').onchange=render;$('search').oninput=render;$('date').onchange=render;$('add').onclick=()=>edit();$('rows').onclick=ev=>{const b=ev.target.closest('button[data-id]');if(b)edit(Number(b.dataset.id))};$('cancel').onclick=()=>$('dialog').close();$('date').value=today;switchView();
</script></html>
